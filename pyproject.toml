[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "SpinExplorer"
version = "1.4"
authors = [{name="James Eaton, Gogulan Karunanithy (Bind Research)"}]
description = "A package for NMR processing and analysis"
readme = "README.md"
requires-python = ">3.11"
license = "MIT"
license-files = ["LICEN[CS]E*"]

dependencies = [
    "wxPython == 4.2.4",
    "numpy == 2.3.5",
    "matplotlib == 3.10.8",
    "nmrglue == 0.11",
    "scipy == 1.16.3",
    "darkdetect == 0.8.0",
    "appdirs == 1.4.4",
    "natsort == 8.4.0",
    "pyyaml == 6.0.3",
    "pandas == 3.0.1"
]

[tool.setuptools]
package-dir = { "" = "src" }

[project.urls]
Homepage = "https://github.com/bindresearch/SpinExplorer"
Issues = "https://github.com/bindresearch/SpinExplorer/issues"

[project.scripts]
SpinConverter = "SpinExplorer.SpinConverter.SpinConverter:main"
SpinProcess = "SpinExplorer.SpinProcess.SpinProcess:main"
SpinView = "SpinExplorer.SpinView.SpinView:main"
SpinExplorer = "SpinExplorer.SpinExplorer.SpinExplorer:main"
processSpec = "SpinExplorer.SpinExplorer_CL_tools.processSpec:main"
processBatch = "SpinExplorer.SpinExplorer_CL_tools.processBatch:main"